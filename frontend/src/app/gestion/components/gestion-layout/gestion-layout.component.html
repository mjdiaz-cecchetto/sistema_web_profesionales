<div class="h-screen w-screen bg-stone-100 font-sans text-stone-700 flex overflow-hidden">

  <!-- ===== Sidebar Desktop (oscuro: back-office de la plataforma) ===== -->
  <aside class="hidden md:flex flex-col w-[264px] bg-stone-900 shrink-0 h-full overflow-y-auto">

    <!-- Logo -->
    <div class="h-20 flex items-center gap-3 px-6 shrink-0 border-b border-stone-800">
      <div class="w-10 h-10 rounded-xl bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300 font-extrabold text-lg">
        P
      </div>
      <div>
        <h2 class="font-extrabold text-stone-100 text-sm tracking-tight leading-none">Plataforma</h2>
        <p class="text-[10px] text-teal-300 font-bold uppercase tracking-[0.18em] mt-1">Gestión</p>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-grow px-4 py-5 space-y-1">
      <p class="px-3 pb-2 text-[10px] font-bold uppercase tracking-[0.16em] text-stone-500">Administración</p>

      <a *ngFor="let item of menu" [routerLink]="item.route"
         routerLinkActive="bg-stone-800 !text-teal-300"
         class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-semibold text-stone-400 rounded-xl hover:bg-stone-800/70 hover:text-stone-100 transition-colors">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon"></path>
        </svg>
        {{ item.label }}
      </a>

      <p class="px-3 pt-5 pb-2 text-[10px] font-bold uppercase tracking-[0.16em] text-stone-500">Próximamente</p>
      <span class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-semibold text-stone-600 cursor-not-allowed" title="Próximamente">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        Reportes
      </span>
      <span class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-semibold text-stone-600 cursor-not-allowed" title="Próximamente">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        </svg>
        Configuración
      </span>
    </nav>

    <!-- Usuario -->
    <div class="px-4 py-5 border-t border-stone-800 shrink-0">
      <p class="px-3 text-xs font-bold text-stone-300 truncate">{{ auth.admin()?.nombre }}</p>
      <p class="px-3 text-[10px] text-stone-500 truncate mb-3">{{ auth.admin()?.email }}</p>
      <button (click)="salir()"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-[13px] font-semibold text-stone-400 rounded-xl hover:bg-stone-800/70 hover:text-stone-100 transition-colors">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- ===== Contenido ===== -->
  <div class="flex-grow flex flex-col h-full overflow-hidden">

    <!-- Header mobile -->
    <header class="md:hidden bg-stone-900 text-stone-100 shrink-0">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300 font-extrabold text-sm">P</div>
          <span class="font-extrabold text-sm tracking-tight">Plataforma · Gestión</span>
        </div>
        <button (click)="salir()" class="text-[11px] font-bold text-stone-300 border border-stone-700 rounded-lg px-2.5 py-1.5">Salir</button>
      </div>
      <nav class="px-3 pb-3 flex gap-1.5 overflow-x-auto">
        <a *ngFor="let item of menu" [routerLink]="item.route"
           routerLinkActive="bg-teal-500/20 !text-teal-300 border-teal-400/30"
           class="shrink-0 px-3.5 py-1.5 rounded-xl border border-stone-700 text-xs font-bold text-stone-300">
          {{ item.label }}
        </a>
      </nav>
    </header>

    <!-- Vistas hijas -->
    <main class="flex-grow p-4 md:p-6 lg:p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
