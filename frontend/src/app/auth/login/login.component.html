<div class="min-h-screen bg-teal-50 flex items-center justify-center px-4 py-10 relative overflow-hidden">
  <!-- Formas decorativas pastel -->
  <div class="absolute -top-16 -left-16 w-64 h-64 rounded-full bg-teal-100 anim-float" aria-hidden="true"></div>
  <div class="absolute -bottom-20 -right-10 w-80 h-80 rounded-full bg-teal-100 anim-float" style="animation-delay: 1.2s" aria-hidden="true"></div>
  <div class="absolute top-1/3 right-1/4 w-6 h-6 rounded-full bg-teal-200 anim-float" style="animation-delay: .6s" aria-hidden="true"></div>

  <div class="relative w-full max-w-md anim-entrada">
    <!-- Marca -->
    <div class="text-center mb-6">
      <a routerLink="/" class="inline-flex items-center gap-2.5">
        <span class="w-11 h-11 rounded-2xl bg-teal-200 border border-teal-300 flex items-center justify-center">
          <svg class="w-6 h-6 text-teal-800" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
          </svg>
        </span>
        <span class="text-xl font-bold text-gray-800">Sistema de Turnos</span>
      </a>
      <p class="text-sm text-gray-500 mt-2">Ingresá al panel de tu consultorio o cuenta profesional</p>
    </div>

    <!-- Card de login -->
    <div class="card p-6 sm:p-8">
      <form (ngSubmit)="ingresar()" autocomplete="on">
        <label class="field-label" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="input mb-4"
          placeholder="tu@email.com"
          autocomplete="username"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email" />

        <label class="field-label" for="login-pass">Contraseña</label>
        <div class="relative mb-1">
          <input
            id="login-pass"
            [type]="verPassword() ? 'text' : 'password'"
            class="input pr-11"
            placeholder="••••••••"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password" />
          <button
            type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-gray-400 hover:text-teal-700 hover:bg-teal-50 transition-colors"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!verPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg *ngIf="verPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <p *ngIf="error()" class="mt-3 text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5">
          {{ error() }}
        </p>

        <button type="submit" class="btn-primary w-full justify-center mt-5" [disabled]="enviando()">
          <span *ngIf="!enviando()">Ingresar al panel</span>
          <span *ngIf="enviando()">Ingresando…</span>
        </button>
      </form>
    </div>

    <!-- Cuentas demo (solo desarrollo: environment.demoCredenciales) -->
    <div class="mt-5" *ngIf="mostrarDemos">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400 text-center mb-2.5">Cuentas de demostración · clic para completar</p>
      <div class="grid gap-2.5">
        <button
          *ngFor="let demo of demos"
          type="button"
          (click)="usarDemo(demo)"
          class="card px-4 py-3 flex items-center gap-3.5 text-left hover:border-teal-300 hover:bg-teal-50/60 transition-colors">
          <span class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                [ngClass]="demo.icono === 'consultorio' ? 'bg-teal-100 text-teal-800' : demo.icono === 'profesional' ? 'bg-amber-50 text-amber-700 border border-amber-100' : 'bg-stone-800 text-stone-100'">
            <!-- consultorio: edificio -->
            <svg *ngIf="demo.icono === 'consultorio'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z" />
            </svg>
            <!-- profesional: persona -->
            <svg *ngIf="demo.icono === 'profesional'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <svg *ngIf="demo.icono === 'admin'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </span>
          <span class="min-w-0">
            <span class="block text-sm font-semibold text-gray-800 truncate">{{ demo.etiqueta }}</span>
            <span class="block text-xs text-gray-500 truncate">{{ demo.detalle }}</span>
          </span>
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      <a routerLink="/" class="hover:text-teal-700 transition-colors">← Volver al inicio</a>
    </p>
  </div>
</div>
