# Sistema de Turnos — entorno de DESARROLLO.
# Se maneja con el Makefile (make up / make build / make down; make help para el resto).
# No usar tal cual en producción: expone phpMyAdmin y sirve Angular con `ng serve`.
name: sistema_profesionales

x-backend: &backend
  build:
    context: ./docker/backend
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: sistema_profesionales/backend:dev
  volumes:
    - ./backend:/var/www/html
  environment:
    # Dentro de Docker estas variables mandan sobre backend/.env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    BACKEND_PORT: ${BACKEND_PORT:-8000}
    # Administrador inicial de la plataforma (lo usa el seeder al crear la base)
    PLATAFORMA_ADMIN_NOMBRE: ${PLATAFORMA_ADMIN_NOMBRE:-Administrador}
    PLATAFORMA_ADMIN_EMAIL: ${PLATAFORMA_ADMIN_EMAIL:-admin@turnos.local}
    PLATAFORMA_ADMIN_DNI: ${PLATAFORMA_ADMIN_DNI:-}
    PLATAFORMA_ADMIN_PASSWORD: ${PLATAFORMA_ADMIN_PASSWORD:-}
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Laravel (PHP-FPM). nginx le pasa las peticiones.
  backend:
    <<: *backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Cola de Laravel: envío de avisos (WhatsApp / email) en segundo plano.
  queue:
    <<: *backend
    user: app
    command: ["sh", "-c", "until [ -f vendor/autoload.php ] && [ -f .env ]; do echo 'Esperando el backend (make init)...'; sleep 5; done; exec php artisan queue:work --tries=3 --sleep=3"]

  # Tareas programadas de Laravel (p. ej. vencer turnos pendientes sin confirmar).
  scheduler:
    <<: *backend
    user: app
    command: ["sh", "-c", "until [ -f vendor/autoload.php ] && [ -f .env ]; do echo 'Esperando el backend (make init)...'; sleep 5; done; exec php artisan schedule:work"]

  # Atrapa los emails que manda Laravel y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Angular con recarga automática.
  frontend:
    build:
      context: ./docker/frontend
    image: sistema_profesionales/frontend:dev
    environment:
      # ng serve reenvía /api a Laravel (frontend/proxy.conf.mjs)
      API_PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      - nginx
    restart: unless-stopped

  # API simulada (json-server) que usa el frontend hasta conectarlo a Laravel.
  mock-api:
    image: sistema_profesionales/frontend:dev
    command: ["npx", "json-server", "--watch", "db.json", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${MOCK_API_PORT:-3000}:3000"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mysql-data:
  frontend-node-modules:
